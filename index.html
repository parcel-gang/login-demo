<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Demo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f2f5;
        }

        .container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 70px;
            padding: 20px;
        }

        .intro {
            max-width: 420px;
        }

        .intro h1 {
            color: #1877f2;
            font-size: 52px;
            margin: 0 0 10px;
        }

        .intro p {
            font-size: 24px;
            line-height: 1.3;
        }

        .login-box {
            background: white;
            width: 360px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #1877f2;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #166fe5;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            background: #e7f3ff;
            border-radius: 5px;
            text-align: center;
            display: none;
        }

        @media (max-width: 700px) {
            .container {
                flex-direction: column;
                gap: 20px;
            }

            .intro {
                text-align: center;
            }

            .intro h1 {
                font-size: 42px;
            }

            .intro p {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="intro">
            <h1>SocialBook</h1>

            <p>
                A simple demonstration login page
                for learning web development.
            </p>
        </div>

        <div class="login-box">

            <form id="demoForm">

                <input
                    type="text"
                    placeholder="Email or phone number"
                    autocomplete="off"
                >

                <input
                    type="password"
                    placeholder="Password"
                    autocomplete="off"
                >

                <button type="submit">
                    Log In
                </button>

            </form>

            <div class="message" id="message">
                Demo login successful — no data was collected or sent.
            </div>

        </div>

    </div>

    <script>
        document.getElementById("demoForm").addEventListener("submit", function(event) {

            // Stop the form from sending data anywhere
            event.preventDefault();

            // Show demonstration message
            document.getElementById("message").style.display = "block";

            // Clear the fields
            this.reset();
        });
    </script>

</body>
</html>
